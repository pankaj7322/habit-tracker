<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Next-Level Habit Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  padding:0;
  background:#f0f2f5;
}
.container{
  max-width: 960px;
  margin: 20px auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}
h1{text-align:center;margin-bottom:10px;}
.progress-bar{
  height:14px;
  width:100%;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress{
  height:100%;
  width:0%;
  background:#4CAF50;
  transition: width 0.4s;
}
.stats{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}
.badges span{
  padding:5px 10px;
  margin:3px;
  background:gold;
  border-radius:6px;
  display:inline-block;
}
.controls{
  margin:15px 0;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#4CAF50;
  color:white;
}
button.reset{background:#ff4d4d;}
.dark{
  background:#121212;
  color:white;
}
.dark .container{background:#1e1e1e;}
.card{
  display:flex;
  justify-content:space-between;
  padding:10px 15px;
  margin:6px 0;
  border-radius:8px;
  background:#f7f7f7;
}
.card.dark{background:#2a2a2a;}
.card small{color:gray;font-size:12px;}
.card input[type="checkbox"]{transform:scale(1.2);}
#notes{
  width:100%;
  height:60px;
  margin-top:10px;
  border-radius:6px;
  padding:8px;
  border:1px solid #ccc;
  resize:none;
}
canvas{margin-top:20px;}
#confetti{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;}
@media(max-width:600px){
  .card{flex-direction:column; align-items:flex-start;}
  .card div{margin:4px 0;}
}
</style>
</head>
<body>

<div class="container">
<h1>🔥 Next-Level Habit Tracker</h1>

<div class="stats">
<div>Progress: <span id="count">0</span>/100</div>
<div>🔥 Streak: <span id="streak">0</span> days</div>
</div>

<div class="progress-bar"><div class="progress" id="progress"></div></div>
<div id="badges" class="badges"></div>

<div id="cards"></div>

<h3>Daily Notes</h3>
<textarea id="notes" placeholder="Write today's notes..."></textarea>

<div class="controls">
<button onclick="toggleDark()">🌙 Dark Mode</button>
<button class="reset" onclick="resetAll()">Reset</button>
<button onclick="exportCSV()">📥 Export CSV</button>
</div>

<h3>Progress Chart</h3>
<canvas id="habitChart"></canvas>

</div>

<canvas id="confetti"></canvas>

<script>
const startDate=new Date();
let data=JSON.parse(localStorage.getItem("habitData"))||{};
let notesData=localStorage.getItem("habitNotes")||"";
document.getElementById("notes").value=notesData;
document.getElementById("notes").addEventListener("input",e=>{
  localStorage.setItem("habitNotes",e.target.value);
});

const habits=["Workout","Study","Meditation","Reading"];
const cardsDiv=document.getElementById("cards");

for(let i=1;i<=100;i++){
  let date=new Date(startDate);
  date.setDate(startDate.getDate()+(i-1));
  let formatted=date.toLocaleDateString();

  let div=document.createElement("div");
  div.className="card "+(document.body.classList.contains("dark")?"dark":"");
  div.innerHTML=`<div>Day ${i}<br><small>${formatted}</small></div>
    ${habits.map(h=>`<div>${h}: <input type="checkbox" data-day="${i}" data-habit="${h.toLowerCase()}"> </div>`).join("")}`;
  cardsDiv.appendChild(div);
}

document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
  let day=cb.dataset.day;
  let habit=cb.dataset.habit;
  if(data[day] && data[day][habit]) cb.checked=true;

  cb.addEventListener("change",()=>{
    if(!data[day]) data[day]={};
    data[day][habit]=cb.checked;
    localStorage.setItem("habitData",JSON.stringify(data));
    updateStats();
  });
});

let chart;
function updateChart(value){
  let ctx=document.getElementById("habitChart");
  if(chart) chart.destroy();
  chart=new Chart(ctx,{type:"doughnut",
    data:{labels:["Completed","Remaining"],
    datasets:[{data:[value,100-value],backgroundColor:["#4CAF50","#ddd"]}]}
  });
}

function updateBadges(c){
  const badgesDiv=document.getElementById("badges");
  badgesDiv.innerHTML="";
  if(c>=10) badgesDiv.innerHTML+="<span>🏅 10 Days</span>";
  if(c>=25) badgesDiv.innerHTML+="<span>🥈 25 Days</span>";
  if(c>=50) badgesDiv.innerHTML+="<span>🥇 50 Days</span>";
  if(c>=75) badgesDiv.innerHTML+="<span>💎 75 Days</span>";
  if(c>=100) badgesDiv.innerHTML+="<span>👑 100 Days</span>";
}

function updateStats(){
  let completed=0, streak=0;
  for(let i=1;i<=100;i++){
    let h=data[i];
    if(h && Object.values(h).every(v=>v===true)){
      completed++;
      streak++;
    }else break;
  }
  document.getElementById("count").innerText=completed;
  document.getElementById("streak").innerText=streak;
  document.getElementById("progress").style.width=(completed/100*100)+"%";
  updateBadges(completed);
  updateChart(completed);
  if(completed===100) confetti();
}

function toggleDark(){
  document.body.classList.toggle("dark");
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("dark"));
}

function resetAll(){
  if(confirm("Reset all progress?")){
    localStorage.clear();
    location.reload();
  }
}

function confetti(){
  let canvas=document.getElementById("confetti");
  let ctx=canvas.getContext("2d");
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  for(let i=0;i<300;i++){
    ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
    ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,5,5);
  }
}

function exportCSV(){
  let csv="Day,Date,"+habits.join(",")+"\n";
  for(let i=1;i<=100;i++){
    let date=new Date(startDate);
    date.setDate(startDate.getDate()+(i-1));
    let row=[i,date.toLocaleDateString()];
    habits.forEach(h=>{
      row.push(data[i] && data[i][h.toLowerCase()]?"✔":"");
    });
    csv+=row.join(",")+"\n";
  }
  let blob=new Blob([csv],{type:"text/csv"});
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download="habit_tracker.csv";
  a.click();
  URL.revokeObjectURL(url);
}

updateStats();
</script>
</body>
</html>
